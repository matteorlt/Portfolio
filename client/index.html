    <!-- Fonts décalées hors chemin critique -->
    <script>
      (function () {
        var href =
          'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=Syne:wght@600;700;800&display=swap';
        var loadFonts = function () {
          if (document.querySelector('link[data-google-fonts="1"]')) return;
          var link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = href;
          link.setAttribute('data-google-fonts', '1');
          document.head.appendChild(link);
        };
        if ('requestIdleCallback' in window) {
          window.requestIdleCallback(loadFonts, { timeout: 2500 });
        } else {
          window.addEventListener('load', loadFonts, { once: true });
          setTimeout(loadFonts, 2500);
        }
      })();
    </script>
