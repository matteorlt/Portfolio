name: Build Portfolio

# La mise en production est faite par l’intégration Git de Vercel à chaque push sur main.
# Ce workflow vérifie seulement que le site compile et que le pré-rendu produit bien les pages.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        # Le lockfile est dans client/, pas à la racine du dépôt.
        cache-dependency-path: client/package-lock.json

    - name: 📦 Install dependencies
      run: npm ci
      working-directory: client

    - name: 🏗️ Build frontend
      run: npm run build:prod
      working-directory: client

    - name: 🧪 Verify build
      run: |
        for page in index.html legal-notices.html privacy-policy.html 404.html spa.html; do
          if [ ! -f "client/dist/$page" ]; then
            echo "❌ Page manquante : client/dist/$page"
            exit 1
          fi
        done
        echo "✅ Build OK"
        echo "📊 Fichiers : $(find client/dist -type f | wc -l)"
        echo "📊 Taille : $(du -sh client/dist | cut -f1)"
